<!doctype html><html lang="ko"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>장비별 QR</title><style>body{font-family:Arial,'Noto Sans KR',sans-serif;margin:24px;color:#1d2935}h1{margin-bottom:6px}.note{color:#667684;margin-bottom:22px}.grid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:16px}.card{border:1px solid #dce4eb;border-radius:14px;padding:16px;break-inside:avoid}.meta{font-size:12px;color:#667684;line-height:1.6;margin:8px 0}.qr{width:180px;height:180px}.url{font-size:10px;word-break:break-all;color:#667684;margin-top:8px}@media(max-width:700px){.grid{grid-template-columns:1fr}}@media print{button{display:none}body{margin:10mm}.card{page-break-inside:avoid}}</style></head><body><button onclick="print()">인쇄 / PDF 저장</button><h1>TIG KOREA 장비별 납품 이력 QR</h1><div class="note">QR 하나가 해당 장비의 전용 납품/수리 이력 화면만 엽니다.</div><div class="grid" id="grid"></div><script src="https://cdnjs.cloudflare.com/ajax/libs/qrcodejs/1.0.0/qrcode.min.js"></script><script>const base='https://wantoscar.github.io/QR_System/';const rows=[['EQ-001','XTM365','용문저수지','WXT365A008AHKA17010327'],['EQ-002','FW410','갈천저수지 방수문','WFW410A0A0AHCA22010164'],['EQ-003','XTM365Z','남창보(영광공구)','WXT365Z008AHKA21010042'],['EQ-004','XTM365','남산2제','WXT365A008AHKA17040230'],['EQ-005','FW410','광주호소수력발전소','WFW410A0A0AHCA240100131'],['EQ-006','FW410','장암1배수문','WFW410A0A0AHCA25010089'],['EQ-007','FW750','미지정 현장','WFW750A0H0AHKB23020011'],['EQ-008','XTM365','화순_영벽취입보','WXT365A008AHKA18030175'],['EQ-009','FW410','풍남향 사업소','WFW410A0A0AHCA25020031'],['EQ-010','FML50S','광주_무산양수장','533011']];const g=document.getElementById('grid');rows.forEach(([id,model,site,serial])=>{const url=base+'?id='+encodeURIComponent(id)+'&mode=qr';const c=document.createElement('div');c.className='card';c.innerHTML='<b>'+model+' · '+id+'</b><div class="meta">현장: '+site+'<br>S/N: '+serial+'</div><div class="qr"></div><div class="url">'+url+'</div>';g.appendChild(c);new QRCode(c.querySelector('.qr'),{text:url,width:180,height:180,colorDark:'#073b60',colorLight:'#ffffff'});});</script></body></html>
