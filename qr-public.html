<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>TIG KOREA 장비별 공개 QR</title>
<style>
body{font-family:"Noto Sans KR","Malgun Gothic",sans-serif;margin:0;background:#f4f7fa;color:#1d2935}.wrap{max-width:1040px;margin:30px auto;padding:0 18px}.head{display:flex;align-items:center;gap:10px;margin-bottom:18px;flex-wrap:wrap}.pill{font-size:10px;font-weight:900;background:#e8f7f5;color:#0f766e;border-radius:99px;padding:5px 9px}.grid{display:grid;grid-template-columns:repeat(2,1fr);gap:16px}.card{background:#fff;border:1px solid #dce4eb;border-radius:16px;padding:16px;break-inside:avoid}.top{display:flex;align-items:center;gap:8px}.top h3{margin:0;font-size:17px}.meta{font-size:11px;color:#667684;margin:6px 0 12px;line-height:1.5}.qrrow{display:flex;gap:16px;align-items:center}.qr{width:170px;height:170px;flex:0 0 170px}.url{font-size:10px;color:#667684;word-break:break-all;margin-top:8px}.actions{margin-left:auto;display:flex;gap:8px;flex-wrap:wrap}.btn{border:0;border-radius:9px;background:#0f766e;color:#fff;padding:9px 12px;font-weight:800;cursor:pointer}.btn.sub{background:#073b60}.card-actions{display:flex;gap:8px;margin-top:12px}.card-actions .btn{font-size:12px;padding:8px 11px}.label{font-size:11px;color:#0f766e;font-weight:800;margin-bottom:5px}.note{font-size:12px;color:#667684;line-height:1.6;margin:0 0 18px}
@media(max-width:650px){.grid{grid-template-columns:1fr}.qrrow{align-items:flex-start}.qr{width:150px;height:150px;flex-basis:150px}}
@media print{.actions,.card-actions,.note{display:none}.wrap{max-width:none;margin:0;padding:0}.grid{grid-template-columns:repeat(2,1fr);gap:8mm}.card{box-shadow:none;border:1px solid #bbb;border-radius:0}.head{margin-bottom:8mm}}
</style>
</head>
<body>
<div class="wrap">
  <div class="head">
    <h1 style="margin:0;font-size:25px">장비별 고객사 공개 QR</h1><span class="pill">PUBLIC QR</span>
    <div class="actions">
      <button class="btn sub" onclick="location.href='admin.html'">관리자 화면</button>
      <button class="btn" onclick="print()">전체 인쇄 / PDF 저장</button>
    </div>
  </div>
  <p class="note">각 QR은 <b>public.html?id=장비ID</b>로 연결되어 해당 장비의 공개 정보만 표시합니다. 아래 <b>이 장비 QR 인쇄</b> 버튼을 누르면 선택한 장비 QR 1장만 인쇄할 수 있습니다.</p>
  <div id="grid" class="grid"></div>
</div>
<script src="https://cdnjs.cloudflare.com/ajax/libs/qrcodejs/1.0.0/qrcode.min.js"></script>
<script>
const rows=[
['EQ-001','XTM365','용문저수지'],['EQ-002','FW410','갈천저수지 방수문'],['EQ-003','XTM365Z','남창보(영광공구)'],['EQ-004','XTM365','남산2제'],['EQ-005','FW410','광주호소수력발전소'],['EQ-006','FW410','장암1배수문'],['EQ-007','FW750','미지정 현장'],['EQ-008','XTM365','화순_영벽취입보'],['EQ-009','FW410','풍남향 사업소'],['EQ-010','FML50S','광주_무산양수장']];
const base='https://wantoscar.github.io/QR_System/public.html?id=';
const g=document.getElementById('grid');

function getQrDataUrl(card){
  const canvas=card.querySelector('.qr canvas');
  if(canvas) return canvas.toDataURL('image/png');
  const img=card.querySelector('.qr img');
  if(img) return img.src;
  return '';
}

function printOne(id,model,site,url,card){
  const dataUrl=getQrDataUrl(card);
  const w=window.open('','_blank','width=760,height=900');
  if(!w){alert('팝업이 차단되었습니다. 브라우저에서 팝업을 허용한 뒤 다시 시도해주세요.');return;}
  w.document.write(`<!doctype html><html lang="ko"><head><meta charset="utf-8"><title>${model} ${id} QR 인쇄</title><style>
    @page{size:A4;margin:18mm}body{font-family:"Malgun Gothic",sans-serif;margin:0;color:#1d2935}.sheet{border:2px solid #073b60;border-radius:14px;padding:28px;max-width:520px;margin:25mm auto 0;text-align:center}.brand{font-weight:900;color:#073b60;font-size:18px;margin-bottom:14px}.title{font-size:28px;font-weight:900;margin:8px 0}.site{font-size:16px;color:#526474;margin:8px 0 20px}.qrimg{width:280px;height:280px}.hint{font-size:13px;color:#526474;margin:18px 0 6px}.url{font-size:10px;color:#7b8893;word-break:break-all;margin-top:10px}.printbtn{margin:18px auto 0;padding:10px 18px;border:0;border-radius:8px;background:#0f766e;color:white;font-weight:800;cursor:pointer}@media print{.printbtn{display:none}.sheet{margin:10mm auto 0}}
  </style></head><body><div class="sheet"><div class="brand">TIG KOREA · 장비 이력 조회</div><div class="title">${model} · ${id}</div><div class="site">${site}</div><img class="qrimg" src="${dataUrl}"><div class="hint">QR을 스캔하면 이 장비의 공개 이력 화면만 열립니다.</div><div class="url">${url}</div><button class="printbtn" onclick="window.print()">인쇄</button></div></body></html>`);
  w.document.close();
  w.focus();
}

rows.forEach(([id,model,site])=>{
  const url=base+encodeURIComponent(id);
  const c=document.createElement('div');
  c.className='card';
  c.innerHTML=`<div class="top"><h3>${model} · ${id}</h3></div><div class="meta">${site}</div><div class="qrrow"><div class="qr"></div><div><div class="label">장비 전용 공개 QR</div><div class="url">${url}</div></div></div><div class="card-actions"><button class="btn" data-print>이 장비 QR 인쇄</button><button class="btn sub" data-open>공개 화면 열기</button></div>`;
  g.appendChild(c);
  new QRCode(c.querySelector('.qr'),{text:url,width:170,height:170,colorDark:'#073b60',colorLight:'#ffffff',correctLevel:QRCode.CorrectLevel.M});
  c.querySelector('[data-print]').onclick=()=>printOne(id,model,site,url,c);
  c.querySelector('[data-open]').onclick=()=>window.open(url,'_blank');
});
</script>
</body></html>
