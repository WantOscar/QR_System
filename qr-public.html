<!doctype html><html lang="ko"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>TIG KOREA 장비별 공개 QR</title><style>body{font-family:"Noto Sans KR","Malgun Gothic",sans-serif;margin:0;background:#f4f7fa;color:#1d2935}.wrap{max-width:1120px;margin:30px auto;padding:0 18px}.head{display:flex;align-items:center;gap:10px;margin-bottom:18px;flex-wrap:wrap}.pill{font-size:10px;font-weight:900;background:#e8f7f5;color:#0f766e;border-radius:99px;padding:5px 9px}.grid{display:grid;grid-template-columns:repeat(2,1fr);gap:16px}.card{background:#fff;border:1px solid #dce4eb;border-radius:16px;padding:16px;break-inside:avoid}.top{display:flex;align-items:center;gap:8px}.top h3{margin:0;font-size:17px}.meta{font-size:11px;color:#667684;margin:6px 0 12px;line-height:1.5}.qrrow{display:flex;gap:16px;align-items:center}.qr{width:170px;height:170px;flex:0 0 170px}.url{font-size:10px;color:#667684;word-break:break-all;margin-top:8px}.actions{margin-left:auto;display:flex;gap:8px;flex-wrap:wrap}.btn{border:0;border-radius:9px;background:#0f766e;color:#fff;padding:9px 12px;font-weight:800;cursor:pointer;text-decoration:none}.btn.sub{background:#073b60}.card-actions{display:flex;gap:8px;margin-top:12px}.card-actions .btn{font-size:12px;padding:8px 11px}.label{font-size:11px;color:#0f766e;font-weight:800;margin-bottom:5px}.note{font-size:12px;color:#667684;line-height:1.6;margin:0 0 18px}.filter{display:flex;gap:8px;flex-wrap:wrap;margin:0 0 16px}.chip{border:1px solid #dce4eb;background:#fff;color:#516270;border-radius:99px;padding:7px 11px;font-size:11px;font-weight:800;cursor:pointer}.chip.active{background:#0f766e;color:#fff;border-color:#0f766e}@media(max-width:650px){.grid{grid-template-columns:1fr}.qrrow{align-items:flex-start}.qr{width:150px;height:150px;flex-basis:150px}}@media print{.actions,.card-actions,.note,.filter{display:none}.wrap{max-width:none;margin:0;padding:0}.grid{grid-template-columns:repeat(2,1fr);gap:8mm}.card{box-shadow:none;border:1px solid #bbb;border-radius:0}.head{margin-bottom:8mm}}</style></head><body><div class="wrap"><div class="head"><h1 style="margin:0;font-size:25px">장비별 고객사 공개 QR</h1><span class="pill">PUBLIC QR · 20 DEVICES</span><div class="actions"><a class="btn sub" href="./">관리자 화면</a><button class="btn" onclick="print()">전체 인쇄 / PDF 저장</button></div></div><p class="note">각 QR은 <b>public.html?id=장비ID</b>로 연결되어 해당 장비의 공개 정보만 표시합니다. 제조사 필터로 QR을 나눠서 볼 수도 있습니다.</p><div id="filter" class="filter"></div><div id="grid" class="grid"></div></div><script src="https://cdnjs.cloudflare.com/ajax/libs/qrcodejs/1.0.0/qrcode.min.js"></script><script src="data.js"></script><script>
const D=window.TIG_DATA,base='https://wantoscar.github.io/QR_System/public.html?id=',g=document.getElementById('grid'),f=document.getElementById('filter');let maker='전체';const uniq=a=>[...new Set(a)].sort((a,b)=>a.localeCompare(b,'ko'));function getQrDataUrl(card){const c=card.querySelector('.qr canvas');if(c)return c.toDataURL('image/png');const i=card.querySelector('.qr img');return i?i.src:''}function printOne(x,url,card){const data=getQrDataUrl(card),w=window.open('','_blank','width=760,height=900');if(!w){alert('팝업을 허용한 뒤 다시 시도해주세요.');return}w.document.write(`<!doctype html><html lang="ko"><head><meta charset="utf-8"><title>${x.model} ${x.id} QR</title><style>@page{size:A4;margin:18mm}body{font-family:"Malgun Gothic",sans-serif;margin:0;color:#1d2935}.sheet{border:2px solid #073b60;border-radius:14px;padding:28px;max-width:520px;margin:25mm auto 0;text-align:center}.brand{font-weight:900;color:#073b60;font-size:18px;margin-bottom:14px}.title{font-size:28px;font-weight:900;margin:8px 0}.site{font-size:16px;color:#526474;margin:8px 0 20px}.qrimg{width:280px;height:280px}.hint{font-size:13px;color:#526474;margin:18px 0 6px}.url{font-size:10px;color:#7b8893;word-break:break-all;margin-top:10px}.printbtn{margin:18px auto 0;padding:10px 18px;border:0;border-radius:8px;background:#0f766e;color:white;font-weight:800;cursor:pointer}@media print{.printbtn{display:none}.sheet{margin:10mm auto 0}}</style></head><body><div class="sheet"><div class="brand">TIG KOREA · 장비 이력 조회</div><div class="title">${x.model} · ${x.id}</div><div class="site">${x.maker} / ${x.site}</div><img class="qrimg" src="${data}"><div class="hint">QR을 스캔하면 이 장비의 공개 이력 화면만 열립니다.</div><div class="url">${url}</div><button class="printbtn" onclick="window.print()">인쇄</button></div></body></html>`);w.document.close();w.focus()}function draw(){const makers=['전체',...uniq(D.equipment.map(x=>x.maker))];f.innerHTML=makers.map(m=>`<button class="chip ${m===maker?'active':''}" onclick='maker=${JSON.stringify(m)};draw()'>${m}</button>`).join('');const rows=maker==='전체'?D.equipment:D.equipment.filter(x=>x.maker===maker);g.innerHTML='';rows.forEach(x=>{const url=base+encodeURIComponent(x.id),c=document.createElement('div');c.className='card';c.innerHTML=`<div class="top"><h3>${x.model} · ${x.id}</h3></div><div class="meta">${x.maker} · ${x.site}<br>${x.status}</div><div class="qrrow"><div class="qr"></div><div><div class="label">장비 전용 공개 QR</div><div class="url">${url}</div></div></div><div class="card-actions"><button class="btn" data-print>이 장비 QR 인쇄</button><button class="btn sub" data-open>공개 화면 열기</button></div>`;g.appendChild(c);new QRCode(c.querySelector('.qr'),{text:url,width:170,height:170,colorDark:'#073b60',colorLight:'#ffffff',correctLevel:QRCode.CorrectLevel.M});c.querySelector('[data-print]').onclick=()=>printOne(x,url,c);c.querySelector('[data-open]').onclick=()=>window.open(url,'_blank')})}draw();
</script></body></html>
