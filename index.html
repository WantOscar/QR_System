<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>TIG KOREA 장비 이력 관리</title>
<style>
*{box-sizing:border-box}body{margin:0;font-family:"Noto Sans KR","Malgun Gothic",sans-serif;background:#f4f7fa;color:#1d2935}.wrap{max-width:860px;margin:0 auto;padding:48px 18px}.hero{background:#fff;border:1px solid #dce4eb;border-radius:22px;padding:32px;box-shadow:0 12px 35px rgba(16,44,68,.08)}.brand{color:#073b60;font-weight:900;font-size:14px}.hero h1{font-size:34px;margin:10px 0 10px}.hero p{color:#667684;line-height:1.7}.grid{display:grid;grid-template-columns:1fr 1fr;gap:14px;margin-top:24px}.card{display:block;text-decoration:none;color:inherit;background:#f8fbfd;border:1px solid #dce4eb;border-radius:16px;padding:22px;transition:.15s}.card:hover{transform:translateY(-2px);border-color:#9ebdd2}.card h2{margin:0 0 8px;font-size:18px}.card p{font-size:12px;margin:0}.admin h2{color:#073b60}.public h2{color:#0f766e}.notice{margin-top:18px;padding:13px 15px;background:#fff8e8;border:1px solid #edd79b;border-radius:12px;color:#6d5a34;font-size:12px;line-height:1.6}.loading{text-align:center;padding:70px 20px;color:#667684}@media(max-width:650px){.grid{grid-template-columns:1fr}.hero h1{font-size:28px}.wrap{padding-top:24px}}
</style>
<script>
(function(){
  const q=new URLSearchParams(location.search);
  const id=q.get('id');
  if(id){
    location.replace('public.html?id='+encodeURIComponent(id));
  }
})();
</script>
</head>
<body>
<div class="wrap">
 <div class="hero">
  <div class="brand">TIG KOREA · 기술1팀 시범안</div>
  <h1>납품 장비 이력 관리</h1>
  <p>장비별 납품·수리 이력과 자가진단 가이드를 웹에서 관리하고, 장비 QR은 해당 장비의 고객사 공개 화면으로 바로 연결합니다.</p>
  <div class="grid">
   <a class="card admin" href="admin.html"><h2>관리자용 화면</h2><p>업체 → 지사 → 현장 → 장비 탐색, 내부 관리 정보 및 QR 관리</p></a>
   <a class="card public" href="qr-public.html"><h2>장비별 공개 QR</h2><p>장비별 고객사 공개 QR 확인 · 개별/전체 인쇄</p></a>
  </div>
  <div class="notice"><b>기존 QR도 호환:</b> 예전 주소인 <code>?id=EQ-009&mode=qr</code>로 접속해도 자동으로 <code>public.html?id=EQ-009</code> 공개 화면으로 이동합니다.</div>
 </div>
</div>
</body>
</html>
