const $=s=>document.querySelector(s), esc=v=>String(v??'-').replace(/[&<>"']/g,m=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#039;'}[m]));

function hero(t,d){return `<section class="card hero"><h1>${esc(t)}</h1><p>${esc(d)}</p></section>`}

function info(rows){return `<div class="info">${rows.map(([k,v])=>`<div class="k">${esc(k)}</div><div>${esc(v)}</div>`).join('')}</div>`}
function publicUrl(id){return `https://wantoscar.github.io/QR_System/public.html?id=${encodeURIComponent(id)}`}
function showDetail(id){const x=DATA.equipment.find(v=>v.p.id===id);if(!x)return;Object.assign(state,{org:orgOf(x),branch:branchOf(x),site:siteOf(x),id});crumb();const p=x.p,g=DATA.guides[p.model]||[];const history=[['입고/납품',p.received||'-','장비 입고/납품 관련 등록','현재 상태: '+p.status],['설치',p.install||'-',p.loc||'-',p.install==='-'?'설치일 미등록':'설치 등록'],['수리/AS',p.repair||'-',p.issue||'-','수리 횟수 '+p.count+'회']];$('#app').innerHTML=`<section class="card hero"><h1>${esc(p.model)} · ${esc(p.id)}</h1><p class="serial">S/N ${esc(p.sn)}</p><span class="badge ${badge(p.status)}" style="margin-top:10px">${esc(p.status)}</span></section><div class="detailgrid"><section class="card section"><h2>장비 기본 정보</h2>${info([['제조사',p.maker],['모델',p.model],['장비 ID',p.id],['H/W 시리얼',p.sn],['시스템/현장',p.system||p.loc||'-'],['현재 상태',p.status]])}</section><section class="card section"><h2>고객사 / 관리 정보</h2>${info([['고객사/업체',orgOf(x)],['지사/관리그룹',branchOf(x)],['현장',siteOf(x)],['관리 구분','기술1팀 시범 관리']])}</section></div><section class="card section" style="margin-top:14px"><h2>납품 장비 이력</h2><table class="hist"><thead><tr><th>구분</th><th>일자</th><th>내용</th><th>결과/상태</th></tr></thead><tbody>${history.map(r=>`<tr>${r.map(v=>`<td>${esc(v)}</td>`).join('')}</tr>`).join('')}</tbody></table></section><div class="detailgrid" style="margin-top:14px"><section class="card section"><h2>장비 / 현장 사진</h2><div class="photoGrid"><div class="photo"><b>장비 전면 사진</b><br>시범 데이터 사진 미등록</div><div class="photo"><b>설치 현장 사진</b><br>시범 데이터 사진 미등록</div></div></section><section class="card section"><h2>이 장비 전용 QR</h2><div class="qrwrap"><div id="qrbox" class="qrbox"></div><div><div class="qrtitle">휴대폰 카메라로 스캔하세요</div><div class="qrdesc">${esc(p.model)} · ${esc(p.id)}의 공개 장비 이력 화면으로 바로 연결됩니다.</div><div class="qrbuttons"><button class="btn blue" onclick="window.open('${publicUrl(id)}','_blank')">휴대폰 화면 열기</button><button class="btn soft" onclick="saveQr('${id}')">QR 저장</button><button class="btn soft" onclick="copyLink('${id}')">전용 링크 복사</button><button class="btn soft" onclick="printQr('${id}')">QR 인쇄</button></div></div></div></section></div><section class="card section" style="margin-top:14px"><h2>제조사 / 모델별 자가 진단 · 조치 가이드</h2><table class="guide"><thead><tr><th>장비 증상</th><th>예상 원인</th><th>간단 조치</th><th>문의 기준</th></tr></thead><tbody>${g.map(r=>`<tr>${r.map(v=>`<td>${esc(v)}</td>`).join('')}</tr>`).join('')}</tbody></table><div class="warn">설정 변경 · 초기화 · Config 변경 · 강제 재부팅 등 서비스 영향 가능 작업은 고객사 자가조치 범위에서 제외합니다.</div></section>`;setTimeout(()=>{if(window.QRCode)new QRCode(document.getElementById('qrbox'),{text:publicUrl(id),width:168,height:168,colorDark:'#073b60',colorLight:'#ffffff',correctLevel:QRCode.CorrectLevel.M})},0)}
function qrData(){const q=$('#qrbox');const c=q&&q.querySelector('canvas');if(c)return c.toDataURL('image/png');const i=q&&q.querySelector('img');return i?i.src:null}
function saveQr(id){const d=qrData();if(!d)return alert('QR 생성 후 다시 시도해 주세요.');const a=document.createElement('a');a.href=d;a.download=id+'_QR.png';a.click()}
async function copyLink(id){const u=publicUrl(id);try{await navigator.clipboard.writeText(u);alert('전용 링크를 복사했습니다.')}catch(e){prompt('아래 링크를 복사하세요.',u)}}
function printQr(id){const x=DATA.equipment.find(v=>v.p.id===id),d=qrData(),w=window.open('','_blank');if(!w)return alert('팝업을 허용해 주세요.');w.document.write(`<meta charset="utf-8"><title>${x.p.model} ${id} QR</title><style>body{font-family:Arial,'Malgun Gothic',sans-serif;text-align:center;padding:40px}.sheet{border:2px solid #17324f;border-radius:14px;padding:30px;max-width:480px;margin:auto}img{width:280px}.b{font-weight:900;font-size:24px}.s{color:#667684;margin:10px}</style><div class="sheet"><div class="b">TIG KOREA · 장비 이력 조회</div><h1>${x.p.model} · ${id}</h1><div class="s">${siteOf(x)}</div><img src="${d}"><p>QR을 스캔하면 이 장비의 공개 이력 화면만 열립니다.</p></div><script>onload=()=>setTimeout(()=>print(),200)<\/script>`);w.document.close()}
window.showOrgs=showOrgs;window.showBranches=showBranches;window.showSites=showSites;window.showEq=showEq;window.showDetail=showDetail;window.saveQr=saveQr;window.copyLink=copyLink;window.printQr=printQr;
const q=new URLSearchParams(location.search),id=q.get('id');if(id&&DATA.equipment.some(x=>x.p.id===id))showDetail(id);else showOrgs();
</script>
</body></html>
