function orgOf(x){return x.admin.customer==="한국농어촌공사"?"한국농어촌공사":(x.admin.customer_site||x.admin.customer||"기타 업체")}function branchOf(x){return x.admin.customer==="한국농어촌공사"?(x.admin.customer_site||"미지정 지사"):"관리 현장"}function siteOf(x){return x.public.system_id||x.public.install_location||"미지정 현장"}function uniq(a){return[...new Set(a.filter(Boolean))].sort((a,b)=>a.localeCompare(b,"ko"))}function itemsForOrg(o){return DATA.equipment.filter(x=>orgOf(x)===o)}function itemsForBranch(o,b){return itemsForOrg(o).filter(x=>branchOf(x)===b)}function itemsForSite(o,b,s){return itemsForBranch(o,b).filter(x=>siteOf(x)===s)}function guideFor(m){return DATA.guides[m]||[]}function badgeClass(s){if(s.includes("수리"))return"repair";if(s.includes("완료")||s.includes("보관"))return"ok";return"warn"}function maskedSerial(s){if(!s||s.length<8)return s;return s.slice(0,4)+"••••••"+s.slice(-6)}
function updateUrl(p={}){const u=new URL(location.href);u.search="";Object.entries(p).forEach(([k,v])=>{if(v)u.searchParams.set(k,v)});history.replaceState(null,"",u.pathname+(u.search||""))}function breadcrumb(){if(state.qrMode){$("#breadcrumb").innerHTML="";return}let p=[`<button onclick="showOrgs()">업체</button>`];if(state.org)p.push(`<span>›</span><button onclick='showBranches(${JSON.stringify(state.org)})'>${esc(state.org)}</button>`);if(state.branch)p.push(`<span>›</span><button onclick='showSites(${JSON.stringify(state.org)},${JSON.stringify(state.branch)})'>${esc(state.branch)}</button>`);if(state.site)p.push(`<span>›</span><button onclick='showEquipment(${JSON.stringify(state.org)},${JSON.stringify(state.branch)},${JSON.stringify(state.site)})'>${esc(state.site)}</button>`);if(state.current)p.push(`<span>›</span><span>${esc(state.current)}</span>`);$("#breadcrumb").innerHTML=p.join("")}function hero(t,d){return`<section class="card hero"><h1>${esc(t)}</h1><p>${esc(d)}</p></section>`}
function showOrgs(){state.org=state.branch=state.site=state.current=null;state.qrMode=false;document.body.classList.remove("qr-mode");updateUrl();breadcrumb();const orgs=uniq(DATA.equipment.map(orgOf));$("#app").innerHTML=hero("고객사 / 업체별 장비 관리","먼저 고객사 또는 협력 업체를 선택한 뒤 지사 → 현장 → 장비 순서로 들어갑니다.")+`<div class="section-title"><h2>고객사 / 업체</h2><span class="hint">${orgs.length}개 그룹</span></div><div class="grid">${orgs.map(org=>{const r=itemsForOrg(org),b=uniq(r.map(branchOf)),s=uniq(r.map(siteOf));return`<article class="card org-card" onclick='showBranches(${JSON.stringify(org)})'><div class="icon">ORG</div><h3>${esc(org)}</h3><div class="meta">지사/관리그룹 ${b.length}개<br>현장 ${s.length}개</div><span class="count">장비 ${r.length}대</span></article>`}).join("")}</div>`}
function showBranches(org){state.org=org;state.branch=state.site=state.current=null;state.qrMode=false;document.body.classList.remove("qr-mode");updateUrl({org});breadcrumb();const rows=itemsForOrg(org),branches=uniq(rows.map(branchOf));$("#app").innerHTML=hero(org,org==="한국농어촌공사"?"지사별로 장비를 분류합니다.":"업체 관리 현장별 장비를 확인합니다.")+`<div class="section-title"><h2>${org==="한국농어촌공사"?"지사":"관리 그룹"}</h2><span class="hint">${rows.length}대</span></div><div class="grid">${branches.map(b=>{const r=itemsForBranch(org,b),sites=uniq(r.map(siteOf));return`<article class="card branch-card" onclick='showSites(${JSON.stringify(org)},${JSON.stringify(b)})'><div class="icon">BR</div><h3>${esc(b)}</h3><div class="meta">현장 ${sites.length}개</div><span class="count">장비 ${r.length}대</span></article>`}).join("")}</div>`}
function showSites(org,branch){state.org=org;state.branch=branch;state.site=state.current=null;state.qrMode=false;document.body.classList.remove("qr-mode");updateUrl({org,branch});breadcrumb();const rows=itemsForBranch(org,branch),sites=uniq(rows.map(siteOf));$("#app").innerHTML=hero(branch,"현장을 선택하면 해당 현장에 설치·관리되는 장비 목록을 확인할 수 있습니다.")+`<div class="section-title"><h2>현장</h2><span class="hint">${sites.length}개 현장</span></div><div class="grid">${sites.map(site=>{const r=itemsForSite(org,branch,site);return`<article class="card site-card" onclick='showEquipment(${JSON.stringify(org)},${JSON.stringify(branch)},${JSON.stringify(site)})'><div class="icon">SITE</div><h3>${esc(site)}</h3><div class="meta">${uniq(r.map(x=>x.public.model)).join(" · ")}</div><span class="count">장비 ${r.length}대</span></article>`}).join("")}</div>`}
function showEquipment(org,branch,site){state.org=org;state.branch=branch;state.site=site;state.current=null;state.qrMode=false;document.body.classList.remove("qr-mode");updateUrl({org,branch,site});breadcrumb();const rows=itemsForSite(org,branch,site);$("#app").innerHTML=hero(site,"이 현장에 등록된 장비입니다. 장비를 선택하면 해당 장비의 납품·점검·수리 이력만 확인합니다.")+`<div class="card filters"><input class="input" id="eqSearch" placeholder="모델명 / 시리얼 검색"><select class="input" id="statusFilter"><option value="">전체 상태</option>${uniq(rows.map(x=>x.public.status)).map(v=>`<option>${esc(v)}</option>`).join("")}</select><button class="btn blue" id="resetEq">초기화</button></div><div class="grid" id="eqGrid"></div>`;const render=()=>{const q=$("#eqSearch").value.trim().toLowerCase(),st=$("#statusFilter").value;const f=rows.filter(x=>{const p=x.public,h=[p.model,p.serial,p.equipment_id,p.status].join(" ").toLowerCase();return(!q||h.includes(q))&&(!st||p.status===st)});$("#eqGrid").innerHTML=f.length?f.map(x=>{const p=x.public;return`<article class="card eq-card" onclick='showDetail(${JSON.stringify(p.equipment_id)},false)'><div class="eq-head"><h3>${esc(p.model)}</h3><span class="badge ${badgeClass(p.status)}">${esc(p.status)}</span><span class="badge">${esc(p.equipment_id)}</span></div><div class="meta"><div class="serial">${esc(maskedSerial(p.serial))}</div>최근 이슈: ${esc(p.recent_issue||"-")}</div></article>`}).join(""):`<div class="card empty">조건에 맞는 장비가 없습니다.</div>`};$("#eqSearch").oninput=render;$("#statusFilter").onchange=render;$("#resetEq").onclick=()=>{$("#eqSearch").value="";$("#statusFilter").value="";render()};render()}
function publicInfo(p){const r=[["장비 ID",p.equipment_id],["제조사",p.manufacturer],["모델",p.model],["H/W 시리얼",p.serial],["시스템/현장 ID",p.system_id||"-"],["현재 상태",p.status],["설치 위치",p.install_location||"-"],["설치일",p.install_date||"-"],["입고일",p.received_date||"-"]];return`<div class="info-table">${r.map(([k,v])=>`<div class="k">${esc(k)}</div><div>${esc(v)}</div>`).join("")}</div>`}function deliveryRepairInfo(p){const r=[["납품/입고 일자",p.received_date||p.install_date||"-"],["최근 장애/이슈",p.recent_issue||"-"],["수리 접수일",p.repair_received||"-"],["수리 횟수",p.repair_count??0],["현재 상태",p.status||"-"]];return`<div class="info-table">${r.map(([k,v])=>`<div class="k">${esc(k)}</div><div>${esc(v)}</div>`).join("")}</div>`}function adminInfo(a){const r=[["고객사",a.customer],["지사/업체",a.customer_site],["담당자(마스킹)",a.customer_contact]];return`<div class="info-table">${r.map(([k,v])=>`<div class="k">${esc(k)}</div><div>${esc(v)}</div>`).join("")}</div>`}
const PAGE_BASE="https://wantoscar.github.io/QR_System/";function detailUrl(id){return`${PAGE_BASE}?id=${encodeURIComponent(id)}&mode=qr`}function qrSection(id){return`<div class="qr-panel"><div class="qr-box" id="qrBox"></div><div class="qr-tools"><div class="small"><b>이 장비 전용 주소</b><br>${esc(detailUrl(id))}</div><div style="margin-top:10px"><button class="btn blue" id="regenQr">QR 다시 생성</button></div></div></div>`}function drawQr(id){const box=$("#qrBox");if(!box)return;box.innerHTML="";if(window.QRCode)new QRCode(box,{text:detailUrl(id),width:160,height:160,colorDark:"#073b60",colorLight:"#ffffff",correctLevel:QRCode.CorrectLevel.M});else box.innerHTML='<div class="small">QR 라이브러리를 불러오지 못했습니다.</div>'}
function showDetail(id,qrMode=false){const x=byId[id];if(!x)return;state.current=id;state.qrMode=!!qrMode;if(!qrMode){state.org=orgOf(x);state.branch=branchOf(x);state.site=siteOf(x)}document.body.classList.toggle("qr-mode",!!qrMode);updateUrl({id,mode:qrMode?"qr":""});breadcrumb();const p=x.public,a=x.admin,g=guideFor(p.model);$("#app").innerHTML=`<div class="customer-view-title card hero"><h1>${esc(p.model)} 장비 이력</h1><p>QR로 접속한 장비의 납품·점검·수리 관련 정보만 표시합니다.</p></div><section class="card section" style="margin-bottom:14px"><div class="eq-head"><h3 style="font-size:23px">${esc(p.model)} · ${esc(p.equipment_id)}</h3><span class="badge ${badgeClass(p.status)}">${esc(p.status)}</span></div><div class="serial small">${esc(p.serial)}</div></section><div class="detail-grid"><div class="card section"><h2>장비 기본 정보</h2>${publicInfo(p)}</div><div class="card section"><h2>납품 / 수리 이력</h2>${deliveryRepairInfo(p)}</div><div class="card section internal-only"><h2>고객사 정보 <span class="badge">관리자 잠금</span></h2><div class="locked">고객사/담당자 정보는 관리자 모드에서만 표시합니다.</div><div class="admin-only">${adminInfo(a)}</div></div><div class="card section internal-only"><h2>점검 / 관리 메모</h2><div class="locked">시범안에서는 내부 관리 영역으로 분리합니다.</div><div class="admin-only"><div class="info-table"><div class="k">점검 상태</div><div>시범 데이터 미등록</div><div class="k">관리 메모</div><div>시범 데이터 미등록</div></div></div></div></div><section class="card section" style="margin-top:14px"><h2>제조사 / 모델별 자가 진단 · 조치 가이드</h2><table class="guide-table"><thead><tr><th>장비 증상</th><th>예상 원인</th><th>간단 조치</th><th>문의 기준</th></tr></thead><tbody>${g.map(v=>`<tr><td>${esc(v.symptom)}</td><td>${esc(v.cause)}</td><td>${esc(v.action)}</td><td>${esc(v.escalate)}</td></tr>`).join("")}</tbody></table><div class="notice">설정 변경 · 초기화 · Config 변경 · 강제 재부팅 등 서비스 영향 가능 작업은 고객사 자가조치 범위에서 제외합니다.</div></section><section class="card section browse-only" style="margin-top:14px"><h2>이 장비 전용 QR</h2>${qrSection(id)}</section>`;document.body.classList.toggle("admin",state.admin);if(!qrMode){drawQr(id);$("#regenQr").onclick=()=>drawQr(id)}}
window.showOrgs=showOrgs;window.showBranches=showBranches;window.showSites=showSites;window.showEquipment=showEquipment;window.showDetail=showDetail;$("#homeBtn").onclick=showOrgs;$("#adminBtn").onclick=()=>state.admin?(state.admin=false,document.body.classList.remove("admin"),$("#adminBtn").textContent="관리자 잠금 해제"):$("#adminModal").classList.add("show");$("#adminCancel").onclick=()=>$("#adminModal").classList.remove("show");$("#adminLogin").onclick=()=>{if($("#adminPin").value===ADMIN_PIN){state.admin=true;document.body.classList.add("admin");$("#adminModal").classList.remove("show");$("#adminBtn").textContent="관리자 모드 잠금";$("#adminPin").value=""}else alert("PIN이 올바르지 않습니다.")};$("#qrAllBtn").onclick=()=>window.open("qr.html","_blank");const qs=new URLSearchParams(location.search),initialId=qs.get("id"),qr=qs.get("mode")==="qr";if(initialId&&byId[initialId])showDetail(initialId,qr);else showOrgs();
</script>
<div class="footer">TIG KOREA · 업체 → 지사 → 현장 → 장비 → 장비별 납품 이력 QR 시범안</div>
</body>
