<!doctype html><html lang="ko"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>TIG KOREA 장비 이력</title><style>
:root{--green:#3f948e;--green2:#e9f6f4;--bg:#f4f7fa;--line:#dbe4ea;--text:#202a35;--muted:#6b7b89}*{box-sizing:border-box}body{margin:0;font-family:"Noto Sans KR","Malgun Gothic",sans-serif;background:var(--bg);color:var(--text)}.head{background:linear-gradient(100deg,#397d78,#4ca39c);color:#fff;padding:22px 24px}.headin{max-width:960px;margin:auto;display:flex;align-items:center;gap:14px}.brand{font-size:22px;font-weight:900}.pill{border:1px solid rgba(255,255,255,.55);border-radius:99px;padding:6px 12px;font-weight:800;font-size:12px}.notice{background:#eaf8f6;border-bottom:1px solid #bfe4df;color:#27645f;text-align:center;font-size:13px;font-weight:800;padding:12px 16px;line-height:1.5}.wrap{max-width:960px;margin:22px auto;padding:0 16px 36px}.card{background:#fff;border:1px solid var(--line);border-radius:18px;padding:20px;box-shadow:0 8px 24px rgba(26,52,72,.06);margin-bottom:14px}.hero h1{margin:0 0 7px;font-size:30px}.sub{color:var(--muted);font-size:13px;line-height:1.6}.status{display:inline-block;margin-top:10px;background:#eef6f5;color:#357a75;padding:6px 9px;border-radius:99px;font-size:11px;font-weight:900}.grid{display:grid;grid-template-columns:1fr 1fr;gap:14px}h2{font-size:17px;margin:0 0 13px;color:#2d6964}.info{display:grid;grid-template-columns:145px 1fr;border:1px solid var(--line);border-radius:12px;overflow:hidden}.info div{padding:10px 12px;border-bottom:1px solid var(--line)}.info div:nth-last-child(-n+2){border-bottom:0}.k{background:#f7f9fb;font-weight:800;color:#536472}.tbl{width:100%;border-collapse:collapse;font-size:12px}.tbl th{background:#3f948e;color:#fff;text-align:left;padding:10px}.tbl td{padding:10px;border-bottom:1px solid var(--line);vertical-align:top;line-height:1.5}.warn{background:#fff7f2;border:1px solid #f1d8c7;color:#8a5131;border-radius:10px;padding:11px 13px;margin-top:10px;font-size:11px;line-height:1.5}.bad{text-align:center;padding:55px 20px}.foot{text-align:center;color:#8996a0;font-size:11px;padding:12px 0 28px}@media(max-width:700px){.grid{grid-template-columns:1fr}.hero h1{font-size:27px}.info{grid-template-columns:125px 1fr}.head{padding:18px 16px}.brand{font-size:20px}.wrap{margin-top:16px}}</style></head><body><header class="head"><div class="headin"><div class="brand">TIG KOREA</div><div class="pill">PUBLIC / CUSTOMER</div></div></header><div class="notice">이 화면은 QR에 연결된 해당 장비의 공개 가능 정보만 표시합니다. 관리자 전용 정보는 제공하지 않습니다.</div><main class="wrap" id="app"></main><div class="foot">TIG KOREA · 장비 이력 조회 시범안</div><script src="data.js"></script><script>
const D=window.TIG_DATA,esc=v=>String(v??'-').replace(/[&<>"']/g,m=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#039;'}[m]));const id=new URLSearchParams(location.search).get('id'),x=D.equipment.find(v=>v.id===id),app=document.getElementById('app');function info(rows){return '<div class="info">'+rows.map(([k,v])=>'<div class="k">'+esc(k)+'</div><div>'+esc(v)+'</div>').join('')+'</div>'}if(!x){app.innerHTML='<div class="card bad"><h2>장비 QR을 확인해 주세요</h2><p class="sub">해당 장비 정보를 찾을 수 없습니다.</p></div>'}else{const g=D.guides[x.model]||D.guides[x.maker]||[];const basic=[['장비 ID',x.id],['제조사',x.maker],['모델',x.model],['H/W 시리얼',x.sn],['시스템/현장',x.system!=='-'?x.system:x.site],['현재 상태',x.status]];const hist=[['입고/납품 관련 일자',x.received],['설치일',x.install],['설치 위치',x.site],['최근 장애/이슈',x.issue],['수리 접수일',x.repair],['수리 횟수',x.repairCount+'회']];app.innerHTML='<section class="card hero"><h1>'+esc(x.model)+' 장비 이력</h1><div class="sub">QR로 접속한 장비의 납품·점검·수리 관련 공개 정보만 표시합니다.</div><span class="status">'+esc(x.status)+'</span></section><div class="grid"><section class="card"><h2>장비 기본 정보</h2>'+info(basic)+'</section><section class="card"><h2>납품 / 수리 이력</h2>'+info(hist)+'</section></div><section class="card"><h2>'+esc(x.maker)+' 자가 진단 · 조치 가이드</h2><table class="tbl"><thead><tr><th>장비 증상</th><th>예상 원인</th><th>간단 조치</th><th>문의 기준</th></tr></thead><tbody>'+g.map(v=>'<tr>'+v.map(c=>'<td>'+esc(c)+'</td>').join('')+'</tr>').join('')+'</tbody></table><div class="warn">설정 변경 · 초기화 · Config 변경 · 강제 재부팅/reload 등 서비스 영향 가능 작업은 고객사 자가조치 범위에서 제외합니다.</div></section>'}
</script></body></html>
